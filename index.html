<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corners</title><style>*{box-sizing:border-box}body{background:#171b20;color:#eee;font:16px system-ui;margin:0;padding:20px}main{max-width:520px;margin:auto}h1{margin:0 0 12px}button,select{font:inherit;padding:10px;border:0;border-radius:8px;background:#38434d;color:white}#board{display:grid;grid-template-columns:repeat(8,1fr);margin:12px 0;overflow:hidden;border-radius:6px}.sq{aspect-ratio:1;display:grid;place-items:center;padding:0;border-radius:0}.piece{width:72%;height:72%;border-radius:50%;border:3px solid #888;box-shadow:0 3px 4px #0006}.white{background:#faf6e8}.black{background:#252932}.sel{outline:4px solid #eab64c;outline-offset:-4px}.target:after{content:'';width:25%;height:25%;background:#35a96b;border-radius:50%}.clock{font-size:32px;font-variant-numeric:tabular-nums;background:#30363d;padding:8px 15px;border-radius:8px}.active{background:#245c43}p{color:#b9c1ca}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}</style><main><h1>Corners</h1><div class="row"><select id="control"><option value="300,3">5 + 3</option><option value="180,2">3 + 2</option><option value="600,0">10 min</option></select><button id="new">New game</button><button id="share">Invite friend</button></div><p id="status">Connecting…</p><div id="black" class="clock">05:00</div><div id="board"></div><div id="white" class="clock">05:00</div><p><button id="end">End jump sequence</button></p><p>Move horizontally or vertically. Jump over one piece at a time. Fill the opposite corner to win.</p></main><script>
let id=new URLSearchParams(location.search).get('room')||crypto.randomUUID();history.replaceState(null,'','?room='+id);let state,selected=null,received=0,ws;const $=x=>document.getElementById(x);function connect(){ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host);ws.onopen=()=>{let [base,inc]=$('control').value.split(',').map(Number);ws.send(JSON.stringify({type:'join',room:id,token:sessionStorage.getItem(id),base,inc}))};ws.onmessage=e=>{let m=JSON.parse(e.data);if('token'in m){if(m.token)sessionStorage.setItem(id,m.token);return}state=m;received=Date.now();selected=m.chain;render()};ws.onclose=()=>setTimeout(connect,1500)}connect();function send(m){if(ws.readyState===1)ws.send(JSON.stringify(m))}function targets(f){if(f===null)return [];let b=state.board,out=[];for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let x=f%8+dx,y=(f>>3)+dy;if(x<0||x>7||y<0||y>7)continue;let t=y*8+x;if(!b[t]){if(state.chain===null)out.push(t)}else{x+=dx;y+=dy;if(x>=0&&x<8&&y>=0&&y<8&&!b[y*8+x])out.push(y*8+x)}}return out}function render(){if(!state)return;let s=state;$('status').textContent=s.winner?(s.winner===1?'White':'Black')+' wins!':!s.started?'Waiting for opponent — share your invitation':(s.turn===0?'White':'Black')+' to move · '+(s.seat<0?'Spectating':s.seat===0?'You are White':'You are Black');$('board').replaceChildren();let ts=targets(selected);for(let j=0;j<64;j++){let i=s.seat===1?63-j:j,b=document.createElement('button');b.className='sq'+(selected===i?' sel':'')+(ts.includes(i)?' target':'');b.style.background=((i%8+(i>>3))%2?'#947658':'#eddfc6');if(s.board[i]){let p=document.createElement('span');p.className='piece '+(s.board[i]===1?'white':'black');b.append(p)}b.onclick=()=>{if(s.turn!==s.seat||!s.started||s.winner)return;if(ts.includes(i))send({type:'move',from:selected,to:i});else if(s.board[i]===s.seat+1&&s.chain===null){selected=i;render()}};$('board').append(b)}$('end').disabled=s.chain===null||s.seat!==s.turn;tick()}function tick(){if(!state)return;for(let i=0;i<2;i++){let t=Math.max(0,Math.ceil((state.time[i]-(state.started&&!state.winner&&state.turn===i?Date.now()-received:0))/1000)),el=$(i?'black':'white');el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');el.classList.toggle('active',state.started&&!state.winner&&state.turn===i)}}setInterval(tick,100);$('end').onclick=()=>send({type:'end'});$('share').onclick=async()=>{if(navigator.share)await navigator.share({url:location.href});else{await navigator.clipboard.writeText(location.href);alert('Invitation copied')}};$('new').onclick=()=>location.href='?room='+crypto.randomUUID()+'&control='+$('control').value;let c=new URLSearchParams(location.search).get('control');if(c)$('control').value=c;</script></html>
